# FP-DETR – ResNet-18 configuration (lightweight, faster inference)

model:
  num_classes: 1
  num_queries: 300
  hidden_dim: 256
  num_heads: 8
  num_encoder_layers: 1
  num_decoder_layers: 4
  ffn_dim: 1024
  dropout: 0.0
  backbone_depth: 18
  pretrained_backbone: true
  num_csp_blocks: 2

data:
  img_size: [640, 640]
  train_img_folder: "data/train/images"
  train_ann_file:   "data/train/annotations.json"
  val_img_folder:   "data/val/images"
  val_ann_file:     "data/val/annotations.json"
  num_workers: 4
  batch_size: 16

optimizer:
  type: AdamW
  lr: 0.0002
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  grad_clip: 0.1

scheduler:
  type: MultiStepLR
  milestones: [80, 100]
  gamma: 0.1

train:
  epochs: 120
  warmup_epochs: 2
  print_freq: 50
  save_freq: 10
  output_dir: "outputs/fp_detr_r18"

loss:
  lambda_cls: 1.0
  lambda_iou: 2.0
  lambda_l1:  5.0
